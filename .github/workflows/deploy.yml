name: Deploy DATN Server

on:
  push:
    branches:
      - main

concurrency:
  group: datn-server-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - datn-vps3

    steps:
      # - name: Fix runner workspace permissions
      #   run: |
      #     sudo chown -R azureuser:azureuser /home/azureuser/actions-runner/_work || true

      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Prepare production env files
        run: |
          cp /opt/datn-secrets/.env ./.env

          rm -rf ./firebase
          mkdir -p ./firebase
          cp /opt/datn-secrets/firebase/firebase-service-account.json ./firebase/firebase-service-account.json

      - name: Start database and mqtt first
        run: |
          docker compose up -d postgres emqx

      - name: Setup Go for goose
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run database migrations
        run: |
          ~/go/bin/goose -dir internal/database/migrations postgres "postgres://postgres:postgres@127.0.0.1:5432/datn?sslmode=disable" up

      - name: Build and restart backend
        run: |
          docker compose up -d --build backend --remove-orphans

      - name: Show containers
        run: |
          docker compose ps