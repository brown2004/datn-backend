services:
  postgres:
    image: postgres:16-alpine
    container_name: datn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datn
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx-enterprise:6.2.0
    container_name: emqx
    hostname: broker.local
    restart: unless-stopped
    environment:
      EMQX_NODE_NAME: emqx@broker.local
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
      - "8084:8084"
      - "127.0.0.1:18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 25s
      retries: 5

volumes:
  postgres-data:
  emqx-data:
  emqx-log:
